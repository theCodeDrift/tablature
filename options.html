<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>One Group Per Name</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; height: 18rem; font: 13px ui-monospace, monospace; }
      .row { margin: 0.75rem 0; }
      #errors { color: #b00; white-space: pre-line; }
      #status { color: #070; }
      code { background: #eee; padding: 0 3px; }
    </style>
  </head>
  <body>
    <h1>One Group Per Name</h1>
    <p>
      One rule per line: <code>group | color | pattern</code>. First match wins, and groups sit at the
      front of the tab strip in the order they first appear here. Color is optional
      (grey, blue, red, yellow, green, pink, purple, cyan, orange). Patterns use <code>*</code> as a wildcard.
    </p>
    <textarea id="rules" spellcheck="false" placeholder="social | blue | *://*.bsky.app/*
social | blue | *://x.com/*
dev | green | *://github.com/*"></textarea>
    <div id="errors"></div>

    <div class="row"><label><input type="checkbox" id="enabled" /> Enabled</label></div>
    <div class="row"><label><input type="checkbox" id="groupsToTop" /> Keep ruled groups at the front, in rule order</label></div>
    <div class="row">
      Merge same-name groups:
      <label><input type="radio" name="scope" value="window" /> within each window</label>
      <label><input type="radio" name="scope" value="global" /> across all windows (tabs move between windows)</label>
    </div>

    <div class="row">
      <button id="save">Save</button>
      <button id="sweep">Sort all tabs now</button>
      <button id="clear">Forget manual moves</button>
      <span id="status"></span>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
